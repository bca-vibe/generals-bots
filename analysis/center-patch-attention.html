<style>

  #center-patch-attention .meta-line { color: var(--muted-foreground); margin-bottom: 16px; }

  #center-patch-attention .layer-title { margin: 0 0 10px; font-weight: 500; }

  #center-patch-attention .cell { border: 1px solid color-mix(in srgb, var(--border) 70%, transparent); min-width: 0; }
  #center-patch-attention .cell.query { outline: 2px solid var(--foreground); outline-offset: -2px; }
  #center-patch-attention .special { color: var(--muted-foreground); margin-top: 6px; white-space: nowrap; }
  #center-patch-attention .legend-row { display: flex; align-items: center; gap: 8px; margin-top: 18px; color: var(--muted-foreground); }
  #center-patch-attention .legend-ramp { width: 150px; height: 10px; background: linear-gradient(to right, transparent, var(--viz-series-1)); border: 1px solid var(--border); }
  #center-patch-attention .query-key { display: inline-flex; align-items: center; gap: 5px; margin-left: 12px; }
  #center-patch-attention .query-key i { width: 11px; height: 11px; border: 2px solid var(--foreground); }
  @media (max-width: 650px) { #center-patch-attention .head-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

        cell.style.background = `color-mix(in srgb, var(--viz-series-1) ${(intensity * 100).toFixed(1)}%, transparent)`;
        const row = Math.floor(index / 7);
        const column = index % 7;
        cell.title = `Patch (${row}, ${column}): ${(value * 100).toFixed(2)}%`;
        heatmap.appendChild(cell);
      });
      const special = document.createElement('div');
      special.className = 'special';
      special.textContent = `V ${(head.special[0] * 100).toFixed(1)}% · A ${(head.special[1] * 100).toFixed(1)}% · L ${(head.special[2] * 100).toFixed(1)}%`;
      panel.append(heading, heatmap, special);
      grid.appendChild(panel);
    }
    section.append(label, grid);
    layerList.appendChild(section);
  }
})();
</script>
